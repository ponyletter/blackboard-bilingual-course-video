<html lang="en" data-resolution="landscape"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>

column;justify-content:center;align-items:center;text-align:center}.card b{font-size:23px;line-height:1.16}.card span{display:block;margin-top:9px;color:#bdbdb7;font-size:17px;line-height:1.25}.summary{position:absolute;left:200px;bottom:205px;width:1520px;text-align:center;color:#d5d5ce;font-size:23px;line-height:1.35}.summary b{color:#fff;font-size:26px}.subtitle{position:absolute;left:120px;bottom:48px;width:1680px;text-align:center;font-size:25px;line-height:1.28;font-weight:600;text-shadow:0 3px 10px #000}.desk{position:absolute;left:0;bottom:0;width:100%;height:48px;background:linear-gradient(#262624,#090909);box-shadow:0 -10px 28px #000}
</style></head><body><div id="root" data-composition-id="cicd-en-course" data-start="0" data-duration="236.056" data-width="1920" data-height="1080"></div><script>
const scenes=[
[0,23.372,'Why Do Big Teams <em>Rely on CI/CD?</em>','Is manual release always wrong for small teams?',['Release risk|What must systems stop?','Team size|Coordination expands','Change rate|Release rhythm varies','System scope|More dependencies','Failure cost|Impact varies','Human judgment|What still belongs to people?'],'Start with the real question:|CI/CD is a way to manage delivery risk, not a belief system.','Why do large organizations often rely on CI/CD, while many small teams still release manually or keep only a deployment script? This is not a question of who is more professional. The real question is which risks must be stopped by a system between a commit and a customer-facing release, and which decisions can still be made by people. Team size, change frequency, system complexity, and failure cost lead to different answers.'],
[24.022,22.877,'CI Is About <em>Fast Feedback</em>','Frequent integration is the means; catching regressions early is the purpose.',['Shared repository|One working baseline','Automatic builds|Can it complete?','Automatic tests|Does it behave?','Integration checks|Do parts work together?','Fast feedback|Expose regressions early','Working version|Keep collaboration moving'],'CI is not “running a command automatically.”|It tells the team early whether a change still works.','CI means continuous integration: developers frequently merge changes into a shared repository, and each change automatically triggers builds, tests, and integration checks. Its core is not merely running a command automatically. It is finding regressions early, so everyone can keep building on a working version. Without fast feedback, later deployment automation only amplifies problems faster.'],
[47.549,24.100,'CD: How Far Is <em>Automated?</em>','Continuous delivery and continuous deployment draw different release boundaries.',['Continuous delivery|Production-ready environment','Human approval|Final release authority','Continuous deployment|Release after all gates pass','Automated gates|Defined checks must pass','Risk controls|Adjust to the business','Test maturity|Enables more automation'],'The key CD distinction:|How far is automated, and who has final release authority?','CD commonly has two meanings. Continuous delivery automatically brings verified changes to a production-ready environment, while a person may still approve the final release. Continuous deployment sends changes to customers after all required gates pass. Neither term simply means “deploy automatically.” For high-risk, regulated, or insufficiently tested systems, human approval can be a sensible control rather than a sign of immaturity.'],
[72.300,23.798,'A Script Is Not <em>Full CI/CD</em>','A script can be one job; a delivery system needs more boundaries.',['Triggers|What change starts work?','Runners|Isolated and repeatable','Test gates|Failure must stop flow','Artifact version|Know what shipped','Secret handling|Protect sensitive values','Rollback and alerts|Respond quickly'],'A script is raw material.|CI/CD turns delivery into a controlled system.','So, “I have a deployment script” does not mean “I have CI/CD.” A script matters and can be a job inside a pipeline. But reliable delivery also defines triggers, isolated runners, test gates, artifact versions, secret handling, deployment records, rollback paths, and failure alerts. Missing some of these does not make releases impossible; it means risk is still carried by personal memory and live operations.'],
[96.748,28.294,'Scale Amplifies <em>Delivery Uncertainty</em>','Many people, services, and environments make manual consistency harder.',['Many people|Versions change together','Many services|Dependencies grow','Many environments|Keep stages aligned','Permission boundaries|Who can do what?','Audit records|Who did what?','Fast rollback|How to limit failure?'],'A pipeline turns personal experience|into a mechanism the whole team can follow.','Large organizations usually rely on CI/CD not because they enjoy more complicated tools, but because manual work becomes hard to control across many people, services, and environments. Who released which version? Did the same artifact pass the same tests? Who can read sensitive configuration? Can a failure stop or roll back quickly? These questions require repeatable workflows, permission boundaries, and audit records. Pipelines turn experience into mechanisms the whole team can follow.'],
[125.692,26.915,'Manual Release Is <em>Not Always Wrong</em>','The first goal is to avoid locking a process inside one person’s laptop.',['Rare changes|Human cost may be fine','Simple service|Clearer boundaries','Clear ownership|Shorter decisions','Commit scripts|Version the process','Record versions|Know what shipped','Evolve gradually|Add capability by risk'],'Small teams need not copy big teams.|They need less dependence on personal memory.','Manual release is not automatically wrong for a small team. When changes are rare, services are simple, ownership is clear, and release windows are controlled, human checks may cost less than building a complex platform. The risk comes when the process is locked inside one person’s laptop and memory. A safer starting point is to commit scripts to the repository, make inputs and outputs repeatable, record versions and results, then gradually add builds, tests, artifacts, and deployment approval.'],
[153.257,26.645,'Add Maturity <em>One Risk at a Time</em>','Every automation layer should answer one real delivery risk.',['Automatic build|First, ensure it builds','Automatic test|Catch common errors','Immutable artifact|Keep shipped versions','Declarative deploy|Repeat without drift','Gradual rollout|Limit impact area','Monitor and rollback|Detect and recover'],'The right path:|Every new layer should solve a specific real risk.','Delivery maturity can grow layer by layer: first automate builds and unit tests; then create immutable artifacts and retain versions; next make deployments repeatable and declarative; then add environment approvals, gradual rollout or canaries, monitoring, and rollback. Each layer answers a specific risk. It is not about writing longer YAML. CI/CD matters because delivery capability can grow with system complexity.'],
[180.552,27.224,'Choose Tools by <em>Responsibility</em>','A toolchain can combine build, test, deployment, and state synchronization.',['GitHub / GitLab|Source plus workflows','Jenkins|Self-managed Pipeline as Code','CircleCI|Hosted pipelines','Argo CD / Flux|Kubernetes GitOps','Tekton|Cloud-native building blocks','Use together|Coordinate by responsibility'],'Choose tools by their job first,|then by ecosystem, hosting model, and infrastructure.','Mainstream tools are not rival “framework camps.” They occupy different places in a toolchain. GitHub Actions and GitLab CI/CD combine code hosting and workflows; Jenkins supports self-managed, extensible Pipeline as Code; services such as CircleCI provide hosted pipelines; Argo CD and Flux focus on GitOps continuous delivery for Kubernetes; and Tekton provides composable cloud-native pipeline building blocks. They often appear together.'],
[208.426,27.129,'Make <em>Releases Controllable.</em>','Begin with the most common failure; make release observable and auditable.',['Common failure|What fails first?','Automatable checks|What is fast enough?','Human approval|Where is judgment needed?','Failure location|How will we know?','Stop and rollback|How will we limit damage?','Continuous improvement|What layer comes next?'],'The best CI/CD system|is not the most complex pipeline, but the right one for today’s risk.','Finally, use four questions to decide the next step: What release failure happens most often? Which checks can be automated and remain fast enough? Which step still needs human approval? How will we locate, stop, and roll back a failure? If those answers are unclear, do not chase fully automated deployment yet. First make one release repeatable, observable, and auditable; then let automation gradually replace unnecessary manual work.']
];
const root=document.getElementById('root');root.innerHTML=scenes.map((s,i)=>{const cards=s[4].map(x=>{const[a,b]=x.split('|');return`<div class="card"><b>${a}</b><span>${b}</span></div>`}).join('');const[lead,tail]=s[5].split('|');const n=String(i+1).padStart(2,'0');return`<section id="s${i+1}" class="scene clip" data-start="${s[0]}" data-duration="${s[1]}" data-track-index="${i+1}"><div class="dust"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div class="frame"><div class="board"></div></div><div class="title">${s[2]}</div><div class="support">${s[3]}</div><div class="cards">${cards}</div><div class="summary"><b>${lead}</b>${tail}</div><div class="subtitle">${s[6]}</div><audio id="a${i+1}" class="clip" data-start="${s[0]}" data-duration="${s[1]}" data-track-index="${i+11}" src="audio/scene${n}.wav"></audio><div class="desk"></div></section>`}).join('');window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});scenes.forEach((s,i)=>{const q='#s'+(i+1);tl.to(q,{opacity:1,duration:.34},s[0]).to(q,{opacity:0,duration:.32},s[0]+s[1]-.32).from(q+' .title',{opacity:0,y:20,duration:.4},s[0]+.12).from(q+' .cards .card',{opacity:0,y:16,stagger:.045,duration:.28},s[0]+.8)});tl.to('#root',{opacity:0,duration:.45},235.58);window.__timelines['cicd-en-course']=tl;
</script></body></html>

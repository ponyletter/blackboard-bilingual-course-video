<!doctype html>
<html lang="zh-CN" data-resolution="landscape"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
@font-face{font-family:NotoSC;src:url('assets/fonts/NotoSansSC-Regular.ttf');font-weight:400}@font-face{font-family:NotoSC;src:url('assets/fonts/NotoSansSC-SemiBold.ttf');font-weight:600}@font-face{font-family:NotoSC;src:url('assets/fonts/NotoSansSC-Bold.ttf');font-weight:700}*{box-sizing:border-box;margin:0;padding:0}html,body,#root{width:1920px;height:1080px;overflow:hidden}body{font-family:NotoSC,sans-serif;color:#f8f8f3;background:#030303}#root{position:relative;background:radial-gradient(ellipse at 50% 0,#282828 0,#111 43%,#030303 100%)}.scene{position:absolute;inset:0;opacity:0}.dust{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff .7px,transparent .7px),radial-gradient(#fff .5px,transparent .5px);background-size:83px 91px,57px 71px}.lamp{position:absolute;top:0;width:235px;height:54px;border-radius:0 0 120px 120px;background:linear-gradient(#deded5,#696965);box-shadow:0 16px 80px rgba(255,255,236,.2)}.l1{left:250px}.l2{left:843px}.l3{left:1436px}.frame{position:absolute;left:118px;top:122px;width:1684px;height:794px;padding:22px;border:21px solid #393937;border-radius:8px;background:#101010;box-shadow:inset 0 0 0 3px #5c5c57,inset 0 0 75px #000,0 25px 70px #000}.board{position:absolute;inset:22px;border:1px solid #64645f;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.019) 1px,transparent 1px);background-size:47px 47px}.title{position:absolute;left:180px;top:176px;width:1560px;text-align:center;font-size:51px;line-height:1.2;font-weight:700}.title em{font-style:normal;border-bottom:4px solid #ecece4;padding-bottom:8px}.support{position:absolute;left:275px;top:272px;width:1370px;text-align:center;color:#c5c5be;font-size:23px}.cards{position:absolute;left:195px;top:370px;width:1530px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:112px;padding:16px 19px;border:2px solid #cbcbc3;background:rgba(255,255,255,.018);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.card b{font-size:27px}.card span{display:block;margin-top:9px;color:#bdbdb7;font-size:18px;line-height:1.3}.summary{position:absolute;left:225px;bottom:205px;width:1470px;text-align:center;color:#d5d5ce;font-size:24px;line-height:1.4}.summary b{color:#fff;font-size:27px}.subtitle{position:absolute;left:120px;bottom:48px;width:1680px;text-align:center;font-size:29px;line-height:1.35;font-weight:600;text-shadow:0 3px 10px #000}.desk{position:absolute;left:0;bottom:0;width:100%;height:48px;background:linear-gradient(#262624,#090909);box-shadow:0 -10px 28px #000}
</style></head><body><div id="root" data-composition-id="cicd-zh-course" data-start="0" data-duration="231.524" data-width="1920" data-height="1080"></div><script>
const scenes=[
[0,22.861,'为什么大公司离不开<em>CI/CD？</em>','小团队手动发版，真的不专业吗？',['发布风险|哪些必须被系统拦住','团队规模|协作边界会扩大','变更频率|发布节奏不同','系统复杂度|依赖关系更多','失败代价|影响范围不同','人工判断|哪些仍需保留'],'先换问题：|CI/CD 不是信仰，而是管理交付风险的方式。','为什么大公司几乎离不开 CI/CD，而不少小团队仍靠人工发版，甚至只保留一段部署脚本？这不是谁更专业的站队题。真正的问题是：代码从提交到用户看到的过程中，哪些风险必须被系统拦住，哪些环节可以暂时由人判断。团队规模、变更频率、系统复杂度和失败代价，会给出不同答案。'],
[23.511,20.245,'CI 的第一价值：<em>快速反馈</em>','频繁集成不是目的，尽早发现回归才是。',['共享仓库|所有人基于同一版本','自动构建|检查是否能完成','自动测试|验证行为是否正确','集成检查|发现组合问题','快速反馈|尽早暴露回归','可工作版本|让协作继续前进'],'CI 的核心不是“自动跑命令”，|而是让团队尽早知道这次改动是否仍然可用。','CI 是持续集成：开发者频繁把代码合入共享仓库，每次变更自动触发构建、测试和集成检查。它的核心不是“自动跑一下命令”，而是尽早发现回归，让每个人都基于可工作的版本继续开发。没有快速反馈，后面的部署自动化只会更快地放大问题。'],
[44.407,25.771,'CD：自动到哪里，<em>谁来批准？</em>','持续交付和持续部署，不是同一个发布边界。',['持续交付|送到生产就绪环境','人工批准|保留最终发布权','持续部署|门禁通过即发布','自动门禁|满足既定检查','风险控制|按业务调整边界','成熟测试|支持更高自动化'],'CD 的关键区别：|自动到哪里，以及谁拥有最终发布权。','CD 有两种常见含义。持续交付把通过验证的变更自动送到生产就绪环境，最后是否上线仍可由人批准；持续部署则在满足所有门禁后直接面向用户发布。两者都不是“自动上线”的同义词。对风险较高、合规较强或测试尚未成熟的业务，保留人工审批往往是合理控制，而不是落后。'],
[70.827,24.860,'发布脚本，不等于<em>完整 CI/CD</em>','脚本可以是一个作业；交付系统还需要更多边界。',['触发条件|什么变更会运行','运行环境|隔离且可重复','测试门禁|失败不应继续','制品版本|知道发布了什么','密钥管理|避免敏感信息泄露','回滚告警|失败后快速响应'],'脚本是原料，|CI/CD 是把交付变成受控系统。','所以，“我有一段发布脚本”不等于我已经有 CI/CD。脚本当然很重要，它可以是流水线中的一个作业；但完整交付还需要定义触发条件、隔离运行环境、测试门禁、制品版本、密钥管理、部署记录、回滚路径和失败告警。缺其中几项不代表不能发布，却意味着风险仍靠个人记忆和临场操作承担。'],
[96.337,27.044,'规模放大的，是<em>交付不确定性</em>','多人、多服务、多环境，会让人工一致性迅速变难。',['多人协作|版本同时变化','多服务|依赖关系增加','多环境|测试到生产一致','权限边界|谁能做什么','审计记录|谁做过什么','快速回滚|失败如何止损'],'流水线的价值：|把个人经验变成团队共同遵守的机制。','大公司普遍依赖 CI/CD，通常不是因为它们喜欢更复杂的工具，而是人工操作在多人、多服务、多环境下会迅速失控。谁发布了哪个版本？同一制品是否经过相同测试？敏感配置谁能读取？失败能否立刻停止或回滚？这些问题需要可重复流程、权限边界和审计记录来回答。流水线把经验变成团队共同遵守的机制。'],
[124.032,24.765,'小团队手动发版，<em>并非一定错误</em>','先避免把流程锁进个人电脑和个人记忆。',['变更较少|人工成本可接受','服务简单|边界更清楚','责任明确|决策链条短','脚本入库|流程可版本化','记录版本|知道发了什么','逐步演进|按风险加能力'],'小团队的目标不是复制大厂，|而是减少对个人记忆的依赖。','小团队选择手动发版，也不必然错误。变更少、服务简单、负责人明确、上线窗口可控时，人工检查可能比搭建复杂平台更划算。但风险在于把流程锁在某个人的电脑和记忆里。更稳妥的起点，是把脚本提交进仓库，固定输入和输出，记录版本和结果，再逐步加入构建、测试、制品与部署审批。'],
[149.446,27.505,'成熟度要按<em>风险逐层增加</em>','每一层自动化，都应回答一个真实的发布风险。',['自动构建|先确保可构建','自动测试|先拦截常见错误','不可变制品|保留发布版本','声明式部署|重复执行不变形','灰度发布|缩小影响范围','监控回滚|发现并恢复问题'],'正确演进路径：|每增加一层，都是在解决一个具体风险。','成熟度可以一层层增加：先让构建和单元测试自动运行；再生成不可变制品并保存版本；然后把部署写成可重复声明；随后增加环境审批、灰度或金丝雀、监控和回滚。每增加一层，都是在回答一个具体风险，而不是为了把 YAML 写得更长。CI/CD 的价值在于让交付能力随系统复杂度一起成长。'],
[177.602,25.935,'主流工具，看<em>职责而非阵营</em>','工具链可以组合：构建、测试、部署与状态同步各有位置。',['GitHub / GitLab|代码托管与工作流','Jenkins|自建 Pipeline as Code','CircleCI|云托管流水线','Argo CD / Flux|Kubernetes GitOps','Tekton|云原生流水线构件','组合使用|按职责协同'],'选工具先看职责，|再看生态、托管方式和现有基础设施。','主流工具不是互斥的“框架阵营”，而是不同位置的工具链。GitHub Actions 和 GitLab CI/CD 适合把代码托管与流水线结合；Jenkins 适合可自建、可扩展的 Pipeline as Code；CircleCI 等提供云托管流水线；Argo CD 和 Flux 偏向 Kubernetes 的 GitOps 持续交付；Tekton 则提供可组合的云原生流水线构件。它们经常一起出现。'],
[204.187,26.837,'别追求全自动，先让<em>发布可控</em>','从最常见的失败开始，把发布变成可观察、可审计的流程。',['常见失败|最先解决什么','自动检查|哪些足够快','人工批准|哪里仍需判断','故障定位|如何知道出错','停止回滚|如何快速止损','持续改进|下一层加什么'],'最好的 CI/CD，|不是最复杂的流水线，而是最适合当前风险的交付系统。','最后，用四个问题判断下一步：我们最常发生的发布失败是什么？哪些检查可以自动化且足够快？哪一步必须由人批准？失败后如何定位、停止和回滚？如果答案还模糊，就先不要追求全自动部署。先把一次发布做成可重复、可观察、可审计的流程，再让自动化逐步替代不必要的人工动作。']
];
const root=document.getElementById('root');root.innerHTML=scenes.map((s,i)=>{const cards=s[4].map(x=>{const[a,b]=x.split('|');return`<div class="card"><b>${a}</b><span>${b}</span></div>`}).join('');const[lead,tail]=s[5].split('|');const n=String(i+1).padStart(2,'0');return`<section id="s${i+1}" class="scene clip" data-start="${s[0]}" data-duration="${s[1]}" data-track-index="${i+1}"><div class="dust"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div class="frame"><div class="board"></div></div><div class="title">${s[2]}</div><div class="support">${s[3]}</div><div class="cards">${cards}</div><div class="summary"><b>${lead}</b>${tail}</div><div class="subtitle">${s[6]}</div><audio id="a${i+1}" class="clip" data-start="${s[0]}" data-duration="${s[1]}" data-track-index="${i+11}" src="audio/scene${n}.wav"></audio><div class="desk"></div></section>`}).join('');window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});scenes.forEach((s,i)=>{const q='#s'+(i+1);tl.to(q,{opacity:1,duration:.34},s[0]).to(q,{opacity:0,duration:.32},s[0]+s[1]-.32).from(q+' .title',{opacity:0,y:20,duration:.4},s[0]+.12).from(q+' .cards .card',{opacity:0,y:16,stagger:.045,duration:.28},s[0]+.8)});tl.to('#root',{opacity:0,duration:.45},231.05);window.__timelines['cicd-zh-course']=tl;
</script></body></html>

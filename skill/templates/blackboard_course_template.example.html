<!-- Sentence-synchronous blackboard template. Before rendering, inline COURSE_DATA and SENTENCE_TIMELINE generated from measured final sentence WAV files. -->
<!doctype html>
<html lang="zh-CN" data-resolution="landscape"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920,height=1080"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script><style>
@font-face{font-family:NotoSC;src:url('assets/fonts/NotoSansSC-Regular.ttf');font-weight:400}@font-face{font-family:NotoSC;src:url('assets/fonts/NotoSansSC-SemiBold.ttf');font-weight:600}@font-face{font-family:NotoSC;src:url('assets/fonts/NotoSansSC-Bold.ttf');font-weight:700}*{box-sizing:border-box;margin:0;padding:0}html,body,#root{width:1920px;height:1080px;overflow:hidden}body{font-family:NotoSC,sans-serif;color:#f8f8f3;background:#030303}#root{position:relative;background:radial-gradient(ellipse at 50% 0,#282828 0,#111 43%,#030303 100%)}.scene{position:absolute;inset:0;opacity:0}.dust{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff .7px,transparent .7px),radial-gradient(#fff .5px,transparent .5px);background-size:83px 91px,57px 71px}.lamp{position:absolute;top:0;width:235px;height:54px;border-radius:0 0 120px 120px;background:linear-gradient(#deded5,#696965);box-shadow:0 16px 80px rgba(255,255,236,.2)}.l1{left:250px}.l2{left:843px}.l3{left:1436px}.frame{position:absolute;left:118px;top:122px;width:1684px;height:794px;padding:22px;border:21px solid #393937;border-radius:8px;background:#101010;box-shadow:inset 0 0 0 3px #5c5c57,inset 0 0 75px #000,0 25px 70px #000}.board{position:absolute;inset:22px;border:1px solid #64645f;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.019) 1px,transparent 1px);background-size:47px 47px}.title{position:absolute;left:180px;top:176px;width:1560px;text-align:center;font-size:51px;line-height:1.2;font-weight:700}.title em{font-style:normal;border-bottom:4px solid #ecece4;padding-bottom:8px}.support{position:absolute;left:275px;top:272px;width:1370px;text-align:center;color:#c5c5be;font-size:23px}.cards{position:absolute;left:195px;top:370px;width:1530px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:112px;padding:16px 19px;border:2px solid #cbcbc3;background:rgba(255,255,255,.018);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.card b{font-size:27px}.card span{display:block;margin-top:9px;color:#bdbdb7;font-size:18px;line-height:1.3}.summary{position:absolute;left:225px;bottom:205px;width:1470px;text-align:center;color:#d5d5ce;font-size:24px;line-height:1.4}.summary b{color:#fff;font-size:27px}.subtitle{position:absolute;left:120px;bottom:48px;width:1680px;text-align:center;font-size:29px;line-height:1.35;font-weight:600;text-shadow:0 3px 10px #000;opacity:0}.desk{position:absolute;left:0;bottom:0;width:100%;height:48px;background:linear-gradient(#262624,#090909);box-shadow:0 -10px 28px #000}
</style></head><body><div id="root" data-composition-id="blackboard-sentence-course" data-start="0" data-duration="REPLACE_WITH_MEASURED_DURATION" data-width="1920" data-height="1080"></div><script>
/* Inject before render. Each visual scene must use start/end derived from sentence_timeline.json. */
const COURSE_DATA=window.COURSE_DATA||{scenes:[]};
const SENTENCE_TIMELINE=window.SENTENCE_TIMELINE||{sentences:[]};
const root=document.getElementById('root');
function sceneMarkup(scene){const cards=(scene.cards||[]).map(x=>{const[a,b]=x.split('|');return`<div class="card"><b>${a}</b><span>${b}</span></div>`}).join('');const lead=scene.takeaway_lead||'';const tail=scene.takeaway_tail||'';const n=String(scene.scene).padStart(2,'0');const duration=scene.end_seconds-scene.start_seconds;return`<section id="scene${n}" class="scene clip" data-start="${scene.start_seconds}" data-duration="${duration}" data-track-index="${scene.scene}"><div class="dust"></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div class="frame"><div class="board"></div></div><div class="title">${scene.title_html}</div><div class="support">${scene.support}</div><div class="cards">${cards}</div><div class="summary"><b>${lead}</b>${tail}</div><audio class="clip" data-start="${scene.start_seconds}" data-duration="${duration}" data-track-index="${scene.scene+10}" src="${scene.delivery_audio}"></audio></section>`}
root.innerHTML=COURSE_DATA.scenes.map(sceneMarkup).join('')+'<div id="sentenceSubtitle" class="subtitle" aria-live="off"></div><div class="desk"></div>';
function bindSentenceSubtitles(tl,element,timeline){tl.set(element,{textContent:'',opacity:0},0);for(const item of timeline.sentences){tl.set(element,{textContent:item.text,opacity:1},item.start_seconds);tl.set(element,{textContent:'',opacity:0},item.end_seconds)}}
window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});for(const scene of COURSE_DATA.scenes){const id='#scene'+String(scene.scene).padStart(2,'0');tl.to(id,{opacity:1,duration:.34},scene.start_seconds).to(id,{opacity:0,duration:.32},scene.end_seconds-.32).from(id+' .title',{opacity:0,y:20,duration:.4},scene.start_seconds+.12).from(id+' .cards .card',{opacity:0,y:16,stagger:.045,duration:.28},scene.start_seconds+.8)}bindSentenceSubtitles(tl,document.getElementById('sentenceSubtitle'),SENTENCE_TIMELINE);window.__timelines['blackboard-sentence-course']=tl;
</script></body></html>
